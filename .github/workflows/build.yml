name: build

# Construit l'exécutable Windows (.exe) ET l'exécutable macOS (.app/.zip).
# Le build macOS tourne sur un runner macOS hébergé par GitHub : c'est la SEULE
# façon de produire un .app depuis un projet développé sur Windows.
#
# Déclenché : sur un tag "vX.Y.Z" (publie une Release) ou à la main (Actions > Run).

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

# Nécessaire pour que softprops/action-gh-release puisse créer la Release.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Tests
        run: |
          pip install pytest
          python -m pytest tests -q
        env:
          QT_QPA_PLATFORM: offscreen

      # --- Windows : un .exe unique ------------------------------------------
      - name: Build Windows (.exe)
        if: runner.os == 'Windows'
        run: |
          python -c "from PIL import Image; Image.open('assets/logo.png').save('assets/logo.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          pyinstaller --name FastRename --windowed --onefile --noconfirm --icon assets/logo.ico --add-data "assets/logo.png;assets" main.py

      # --- macOS : un .app, signé ad-hoc, puis zippé proprement --------------
      - name: Build macOS (.app + .zip)
        if: runner.os == 'macOS'
        run: |
          mkdir -p logo.iconset
          sips -z 16 16   assets/logo.png --out logo.iconset/icon_16x16.png
          sips -z 32 32   assets/logo.png --out logo.iconset/icon_32x32.png
          sips -z 128 128 assets/logo.png --out logo.iconset/icon_128x128.png
          sips -z 256 256 assets/logo.png --out logo.iconset/icon_256x256.png
          sips -z 512 512 assets/logo.png --out logo.iconset/icon_512x512.png
          iconutil -c icns logo.iconset -o assets/logo.icns
          pyinstaller --name FastRename --windowed --noconfirm --icon assets/logo.icns --add-data "assets/logo.png:assets" main.py
          # Signature ad-hoc (gratuite) : nécessaire sur Apple Silicon pour que
          # l'app puisse s'exécuter une fois la quarantaine retirée par l'ami.
          codesign --force --deep --sign - "dist/FastRename.app"
          # ditto préserve la signature (contrairement au zip du Finder).
          ditto -c -k --keepParent "dist/FastRename.app" "dist/FastRename-macOS.zip"

      # --- Récupération des artefacts ----------------------------------------
      - name: Publier les artefacts du build
        uses: actions/upload-artifact@v4
        with:
          name: FastRename-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            dist/FastRename.exe
            dist/FastRename-macOS.zip

      # --- Release GitHub (seulement sur un tag) -----------------------------
      - name: Publier dans la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FastRename.exe
            dist/FastRename-macOS.zip
